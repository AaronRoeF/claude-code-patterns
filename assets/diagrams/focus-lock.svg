<rect x="320" y="752" width="320" height="64" rx="20" fill="#FFFFFF"/>
<rect x="320" y="752" width="320" height="64" rx="20" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<text x="480" y="788" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">before proceeding</text>
</svg>
