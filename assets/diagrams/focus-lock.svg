<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 856" width="984" height="856" role="img" aria-labelledby="focus-lock-title focus-lock-desc">
<title id="focus-lock-title">Focus Lock with Context-Switch Detection</title>
<desc id="focus-lock-desc">A declared focus project plus a PreToolUse hook: an edit inside a different project directory raises a context-switch warning that holds work until the departing project's tracker is updated; anything else proceeds untouched.</desc>
<defs>
<marker id="focus-lock-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5058"/></marker>
<marker id="focus-lock-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10BA87"/></marker>
<marker id="focus-lock-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00B0FF"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<path d="M 480,128 V 192" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#focus-lock-arrow)"/>
<path d="M 480,256 V 312" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#focus-lock-arrow)"/>
<path d="M 648,392 H 776 Q 784,392 784,400 V 512" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#focus-lock-arrow)"/>
<rect x="686" y="368" width="52" height="12" rx="2" fill="#FFFFFF"/>
<text x="712" y="377" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">If it is</text>
<path d="M 312,392 H 184 Q 176,392 176,400 V 776 Q 176,784 184,784 H 320" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#focus-lock-arrow)"/>
<rect x="228" y="368" width="24" height="12" rx="2" fill="#FFFFFF"/>
<text x="240" y="377" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">no</text>
<path d="M 784,592 V 632" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#focus-lock-arrow)"/>
<path d="M 784,712 V 724 Q 784,732 776,732 H 528 Q 520,732 520,740 V 752" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#focus-lock-arrow)"/>
<rect x="320" y="48" width="320" height="80" rx="20" fill="#FFFFFF"/>
<rect x="320" y="48" width="320" height="80" rx="20" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<text x="480" y="84" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">declare a focus project</text>
<text x="480" y="100" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">~/.claude/current-focus.txt</text>
<rect x="300" y="192" width="360" height="64" rx="6" fill="#FFFFFF"/>
<rect x="300" y="192" width="360" height="64" rx="6" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<text x="480" y="228" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">A PreToolUse hook on Edit/Write</text>
<polygon points="480,312 648,392 480,472 312,392" fill="#FFFFFF"/>
<polygon points="480,312 648,392 480,472 312,392" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
