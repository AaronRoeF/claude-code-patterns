<rect x="624" y="512" width="320" height="80" rx="6" fill="#FFFFFF"/>
<rect x="624" y="512" width="320" height="80" rx="6" fill="#ebf5f1" stroke="#10BA87" stroke-width="1"/>
<text x="784" y="548" fill="#1F2125" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">CONTEXT SWITCH DETECTED</text>
<text x="784" y="564" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">halts work</text>
<rect x="624" y="632" width="320" height="80" rx="6" fill="#FFFFFF"/>
