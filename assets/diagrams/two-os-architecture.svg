<title id="two-os-architecture-title">The "Two OS" Architecture</title>
<desc id="two-os-architecture-desc">Two repos separated by an information barrier: a work repo whose CLAUDE.md governs shared team skills and ships to teammates, and a personal repo whose CLAUDE.md governs private skills and custom MCP servers.</desc>
