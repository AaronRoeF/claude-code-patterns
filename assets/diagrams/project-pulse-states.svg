<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 424" width="896" height="424" role="img" aria-labelledby="project-pulse-states-title project-pulse-states-desc">
<title id="project-pulse-states-title">Project Pulse Files for Completion Tracking</title>
<desc id="project-pulse-states-desc">The status field of a project tracker as a state machine: a project opens as an idea, becomes active, may cycle through blocked, and closes through done into archived.</desc>
<defs>
<marker id="project-pulse-states-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5058"/></marker>
<marker id="project-pulse-states-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10BA87"/></marker>
<marker id="project-pulse-states-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00B0FF"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
