<text x="644" y="176" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">proposes promotions</text>
<rect x="808" y="120" width="248" height="88" rx="6" fill="#FFFFFF"/>
<rect x="808" y="120" width="248" height="88" rx="6" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
