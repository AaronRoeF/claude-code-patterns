<rect x="232" y="120" width="248" height="88" rx="6" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<text x="356" y="152" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">reads the whole memory corpus</text>
<text x="356" y="176" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">The capture corpus</text>
<text x="356" y="192" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">The persistent memory store</text>
<rect x="520" y="120" width="248" height="88" rx="6" fill="#FFFFFF"/>
