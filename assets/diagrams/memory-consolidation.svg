<text x="24" y="300" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">the human</text>
<text x="24" y="412" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">a separate apply command</text>
<path d="M 480,164 H 520" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#memory-consolidation-arrow)"/>
<path d="M 768,164 H 808" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#memory-consolidation-arrow)"/>
