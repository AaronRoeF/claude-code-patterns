<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 504" width="1160" height="504" role="img" aria-labelledby="memory-consolidation-title memory-consolidation-desc">
<title id="memory-consolidation-title">Memory Consolidation Pass (Capture → Consolidate → Graduate)</title>
<desc id="memory-consolidation-desc">A scheduled pass reads the whole memory corpus in one sitting, surfaces cross-source patterns and writes a dated report of proposals; a person ticks the ones to keep, and a separate command applies exactly those.</desc>
<defs>
<marker id="memory-consolidation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5058"/></marker>
<marker id="memory-consolidation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10BA87"/></marker>
<marker id="memory-consolidation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00B0FF"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24" y="72" fill="#1F2125" font-size="8" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">Weekly / on-demand</text>
<rect x="200" y="96" width="920" height="368" rx="8" fill="none" stroke="#1F2125" stroke-width="1"/>
<path d="M 200,240 H 1120" stroke="#4A5058" stroke-width="0.8" fill="none"/>
