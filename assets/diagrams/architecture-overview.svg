<title id="architecture-overview-title">The Architecture (How This Actually Works)</title>
<desc id="architecture-overview-desc">Four tiers: a CLAUDE.md schema layer dispatches to work skills, personal skills and the knowledge base; those reach live data through globally registered MCP servers, and hooks enforce the whole flow on session, tool and permission events.</desc>
