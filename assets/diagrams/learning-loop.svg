<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 616" width="1064" height="616" role="img" aria-labelledby="learning-loop-title learning-loop-desc">
<title id="learning-loop-title">Learning Loops: Capture → Review → Graduate</title>
<desc id="learning-loop-desc">A closed loop: daily signals are captured into dated observation files, reviewed once enough accumulate, and patterns seen on three or more separate days graduate into CLAUDE.md rules, skill files and knowledge updates before the loop returns to capture.</desc>
