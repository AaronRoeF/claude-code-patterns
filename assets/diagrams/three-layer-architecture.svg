<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="three-layer-architecture-title three-layer-architecture-desc">
<title id="three-layer-architecture-title">The Three-Layer Architecture (Sources → Wiki → Schema)</title>
<desc id="three-layer-architecture-desc">A three-band stack: MCP servers feed live data at Layer 1, an Obsidian vault holds the durable knowledge at Layer 2, and CLAUDE.md governs how that wiki is read and written at Layer 3.</desc>
<defs>
<marker id="three-layer-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5058"/></marker>
<marker id="three-layer-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10BA87"/></marker>
<marker id="three-layer-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00B0FF"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24" y="44" fill="#1F2125" font-size="8" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">Sources → Wiki → Schema</text>
<path d="M 72,264 V 80" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#three-layer-architecture-arrow)"/>
<rect x="120" y="64" width="800" height="216" rx="8" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<rect x="120" y="136" width="800" height="72" fill="#ebf5f1" stroke="#10BA87" stroke-width="1"/>
<path d="M 120,136 H 920" stroke="#4A5058" stroke-width="0.8" fill="none"/>
<path d="M 120,208 H 920" stroke="#4A5058" stroke-width="0.8" fill="none"/>
<text x="144" y="104" fill="#1F2125" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">Layer 3</text>
<text x="232" y="106" fill="#1F2125" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Schema (CLAUDE.md)</text>
<text x="896" y="104" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.04em">the governance layer</text>
<text x="144" y="176" fill="#1F2125" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">Layer 2</text>
<text x="232" y="178" fill="#1F2125" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Wiki (Obsidian vault)</text>
<text x="896" y="176" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.04em">The persistent knowledge base</text>
<text x="144" y="248" fill="#1F2125" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">Layer 1</text>
<text x="232" y="250" fill="#1F2125" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Sources (MCP servers)</text>
<text x="896" y="248" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.04em">Live data feeds, not static file drops</text>
</svg>
