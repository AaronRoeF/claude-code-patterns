<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="960" height="608" role="img" aria-labelledby="confirmation-gates-title confirmation-gates-desc">
<title id="confirmation-gates-title">Confirmation Gates on Destructive Actions</title>
<desc id="confirmation-gates-desc">The agent gathers freely and drafts freely; a single confirmation gate stands between the draft and the only irreversible step — sending mail, posting to Slack or changing the calendar.</desc>
<defs>
<marker id="confirmation-gates-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5058"/></marker>
<marker id="confirmation-gates-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10BA87"/></marker>
<marker id="confirmation-gates-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00B0FF"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<path d="M 480,112 V 176" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#confirmation-gates-arrow)"/>
<path d="M 480,256 V 320" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#confirmation-gates-arrow)"/>
<path d="M 600,376 H 732 Q 740,376 740,384 V 480" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#confirmation-gates-arrow)"/>
<rect x="646" y="352" width="28" height="12" rx="2" fill="#FFFFFF"/>
<text x="660" y="361" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">yes</text>
<path d="M 360,376 H 228 Q 220,376 220,384 V 480" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#confirmation-gates-arrow)"/>
<rect x="288" y="352" width="24" height="12" rx="2" fill="#FFFFFF"/>
<text x="300" y="361" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">no</text>
<rect x="320" y="48" width="320" height="64" rx="20" fill="#FFFFFF"/>
<rect x="320" y="48" width="320" height="64" rx="20" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<text x="480" y="84" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">gather information freely</text>
<rect x="320" y="176" width="320" height="80" rx="6" fill="#FFFFFF"/>
<rect x="320" y="176" width="320" height="80" rx="6" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<text x="480" y="212" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Claude drafts</text>
<text x="480" y="228" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">present it for approval</text>
<polygon points="480,320 600,376 480,432 360,376" fill="#FFFFFF"/>
<polygon points="480,320 600,376 480,432 360,376" fill="#ebf5f1" stroke="#10BA87" stroke-width="1"/>
<text x="480" y="380" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">you confirm</text>
<rect x="40" y="480" width="360" height="80" rx="6" fill="#FFFFFF"/>
<rect x="40" y="480" width="360" height="80" rx="6" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<text x="220" y="516" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Do NOT send</text>
<text x="220" y="532" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">until the user confirms</text>
<rect x="560" y="480" width="360" height="80" rx="20" fill="#FFFFFF"/>
<rect x="560" y="480" width="360" height="80" rx="20" fill="#FFFFFF" stroke="#1F2125" stroke-width="1"/>
<text x="740" y="516" fill="#1F2125" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">the point of no return</text>
<text x="740" y="532" fill="#1F2125" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">send emails, push Slack messages, or make calendar changes</text>
</svg>
